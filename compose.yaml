services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: specbound
      POSTGRES_USER: specbound
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specbound -d specbound"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://specbound:local-dev-only@db:5432/specbound
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  minio:
    image: ${MINIO_IMAGE:-ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-specbound}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-dev-only}
    volumes:
      - minio_data:/data
  minio-init:
    image: ${MINIO_IMAGE:-ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9}
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-specbound}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-dev-only}
      BLOBSTORE_BUCKET: ${BLOBSTORE_BUCKET:-specbound}
    command:
      - |
        count=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          count=$$((count + 1))
          [ "$$count" -lt 30 ] || exit 1
          sleep 2
        done
        mc mb --ignore-existing "local/$$BLOBSTORE_BUCKET"
    depends_on:
      - minio
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://specbound:local-dev-only@db:5432/specbound
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      BLOBSTORE_ENDPOINT: http://minio:9000
      BLOBSTORE_BUCKET: ${BLOBSTORE_BUCKET:-specbound}
      BLOBSTORE_ACCESS_KEY: ${MINIO_ROOT_USER:-specbound}
      BLOBSTORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-dev-only}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    init: true
  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
