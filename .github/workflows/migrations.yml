name: PostgreSQL migrations
on:
  push:
  pull_request:

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: specbound
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: specbound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specbound -d specbound_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/api/requirements-dev.txt
      - name: Migrate a fresh database and start the API
        working-directory: services/api
        env:
          TEST_DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_migrations.py' -v
      - name: Exercise organization and team API
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_teams.py' -v
      - name: Exercise team authorization
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_authorization.py' -v
      - name: Verify OIDC access tokens and organization isolation
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_oidc.py' -v
      - name: Exercise agent lifecycle and audit
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_agents.py' -v
      - name: Exercise product ownership and repository bindings
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_products.py' -v
      - name: Exercise scanner coverage and assessment safety
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_coverage.py' -v
      - name: Verify GitHub webhook event intake
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_github_webhook.py' -v
      - name: Verify GitHub repository authorization
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_github_metadata.py' -v
      - name: Verify immutable pack revisions
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_pack_revisions.py' -v
      - name: Verify pack catalog authorization and provenance
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_pack_catalog.py' -v
      - name: Verify evidence freshness and tenant scope
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_evidence_records.py' -v
      - name: Verify persisted control evaluation
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_rule_evaluation.py' -v
      - name: Verify PR and baseline snapshots
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_assessment_snapshots.py' -v
      - name: Verify finding lifecycle and concurrent replay
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: python -m unittest discover -s tests -p 'test_finding_lifecycle.py' -v
      - name: Install collector runner dependencies
        run: pip install -r services/worker/requirements.txt
      - name: Pull pinned test collector
        run: docker pull python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54
      - name: Verify a collector observation is shared
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
          SPECBOUND_DOCKER_TESTS: '1'
        run: python -m unittest discover -s tests -p 'test_evidence_sharing.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
        working-directory: services/web
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: services/web
      - name: Browser team workflow
        working-directory: services/web
        env:
          SPECBOUND_E2E_DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: npm run test:e2e
      - name: Browser OIDC login workflow
        working-directory: services/web
        env:
          SPECBOUND_E2E_DATABASE_URL: postgresql+psycopg://specbound:test-only@127.0.0.1:5432/specbound_test
        run: npx playwright test --config playwright.oidc.config.js
